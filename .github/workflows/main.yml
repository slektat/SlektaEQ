name: Build SlektaEQ APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n1)
          unzip -o "$ZIP"
          rm "$ZIP"
          if [ -d "HonorSoundBoosterV2" ]; then cp -r HonorSoundBoosterV2/* .; rm -rf HonorSoundBoosterV2; fi
          # Töröljük a duplikált _1, _2 fájlokat
          rm -f gradlew_* build.gradle_*.kts settings.gradle_*.kts README_APK*
          rm -f app/build.gradle_*.kts
          find app/src -name "*_*.kt" -delete
          find app/src -name "*_*.xml" -delete
          ls -R app/src | head -n 100
      - name: Fix settings and SDK
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include(":app")
          EOF
          # 35 -> 34 mert 35 nincs a GitHub gépen
          sed -i 's/compileSdk = 35/compileSdk = 34/' app/build.gradle.kts
          sed -i 's/targetSdk = 35/targetSdk = 34/' app/build.gradle.kts
          cat app/build.gradle.kts
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlektaEQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
