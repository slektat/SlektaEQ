name: Build SlektaEQ APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n1)
          unzip -o "$ZIP"
          rm "$ZIP"
          if [ -d "HonorSoundBoosterV2" ]; then cp -r HonorSoundBoosterV2/* .; rm -rf HonorSoundBoosterV2; fi
          rm -f app/src/main/res/values/colors_*.xml app/src/main/res/values/themes_*.xml app/src/main/res/layout/activity_main_*.xml app/src/main/AndroidManifest_*.xml app/src/main/java/com/tibor/honorsoundbooster/MainActivity_*.kt app/build.gradle_*.kts
          sed -i 's/textColor="white"/textColor="#FFFFFF"/g' app/src/main/res/layout/activity_main.xml
          chmod +x gradlew
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SlektaEQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
