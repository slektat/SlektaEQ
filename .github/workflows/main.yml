name: Build SlektaEQ APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Extract and clean
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n1)
          unzip -o "$ZIP"
          rm "$ZIP"
          cp -r HonorSoundBoosterV2/* . 2>/dev/null || true
          rm -rf HonorSoundBoosterV2
          rm -f app/src/main/res/values/colors_*.xml app/src/main/res/values/themes_*.xml app/src/main/res/layout/activity_main_*.xml app/src/main/AndroidManifest_*.xml app/src/main/java/com/tibor/honorsoundbooster/MainActivity_*.kt app/build.gradle_*.kts gradle/wrapper/gradle-wrapper_*.properties
          sed -i 's/"white"/"#FFFFFF"/g' app/src/main/res/layout/activity_main.xml
          chmod +x gradlew
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SlektaEQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
