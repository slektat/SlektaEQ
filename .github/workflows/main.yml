name: Build SlektaEQ APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n1)
          unzip -o "$ZIP"
          rm "$ZIP"
          if [ -d "HonorSoundBoosterV2" ]; then cp -r HonorSoundBoosterV2/* .; rm -rf HonorSoundBoosterV2; fi
          rm -f gradlew_* build.gradle_*.kts settings.gradle_*.kts README_APK*
          rm -f app/build.gradle_*.kts
          rm -f app/src/main/AndroidManifest_*.xml
          rm -rf app/src/main/res/layout/activity_main_*.xml
          ls -la
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlektaEQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
