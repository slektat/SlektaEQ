name: Build SlektaEQ APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
          cache-disabled: true
      - name: Extract
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n1)
          unzip -o "$ZIP"
          rm "$ZIP"
          mv HonorSoundBoosterV2/* . 2>/dev/null || true
          rm -rf HonorSoundBoosterV2
          chmod +x gradlew
          ls app/src/main/res/values/ && ls app/src/main/res/layout/
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SlektaEQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
