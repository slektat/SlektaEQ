name: Build SlektaEQ APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Unzip if needed
        run: |
          ZIPFILE=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -f "$ZIPFILE" ]; then
            unzip -o "$ZIPFILE" -d temp_extract
            cp -r temp_extract/* . 2>/dev/null || true
            rm -rf temp_extract
          fi
          for d in SlektaEQ_Full SlektaEQ_IceBlue SlektaEQ_Project HonorSoundBoosterV2; do
            if [ -d "$d" ]; then cp -r $d/* .; rm -rf $d; fi
          done
          ls -la

      - name: Grant permission
        run: chmod +x gradlew
        
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlektaEQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
